name: CI

on:
  push:
    branches: [main]
    # A tag IS the release here: Packagist publishes from the tag and there is no
    # workflow to gate. Running CI on it turns a bad release into a red run and an
    # email rather than silence.
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit --no-coverage
